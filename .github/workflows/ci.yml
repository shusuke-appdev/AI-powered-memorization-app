name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Compile
        run: python -m compileall app.py auth.py components.py config.py database.py export_import.py stats.py storage.py pages services scripts use_cases tests

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest tests -p no:cacheprovider -q
